services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      DATA_DIR: /data
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:?Set HTTPS PLATFORM_ORIGIN in .env}
      GAMES_ORIGIN: ${GAMES_ORIGIN:?Set HTTPS GAMES_ORIGIN in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - platform_data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:3001'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  platform_data:
    name: ${DATA_VOLUME_NAME:-playroom-data}
