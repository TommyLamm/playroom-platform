# Copy into your game's .github/workflows/release.yml.
# Put deployable files and game.json in game/.
name: Release game
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Add npm ci and npm run build here if compilation is needed.
      # Change game/ below to your build output directory in that case.
      - name: Validate manifest and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'game';
          const m = JSON.parse(fs.readFileSync(path.join(root, 'game.json'), 'utf8'));
          if (m.schemaVersion !== 1 || !/^[a-z][a-z0-9-]{1,47}$/.test(m.id)) throw Error('Invalid manifest');
          if ('v' + m.version !== process.env.RELEASE_TAG) throw Error('Tag and manifest version differ');
          for (const name of [m.entry, m.cover]) {
            if (typeof name !== 'string' || name.includes('..') || path.isAbsolute(name) || !fs.statSync(path.join(root, name)).isFile()) throw Error('Missing or invalid game asset');
          }
          JS
          cd game
          zip -r ../game.zip .
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" game.zip --verify-tag --generate-notes
